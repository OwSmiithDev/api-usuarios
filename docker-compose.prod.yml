# Produção: use com `docker compose -f docker-compose.prod.yml up -d --build`.
# Diferenças para o compose de desenvolvimento:
#   - Postgres NÃO publica porta no host (só a rede interna acessa o banco).
#   - API escuta só em 127.0.0.1 no host; o proxy do Easypanel/Nginx faz o TLS e o roteamento.
#   - Sem --reload, sem código montado por volume.
#   - Todos os segredos vêm do .env (nunca commitado). Gere-os fortes antes de subir.
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # sem `ports:` — o banco fica acessível apenas dentro da rede do compose

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # só o loopback do host; o proxy (Easypanel/Nginx) publica com HTTPS
      - "127.0.0.1:8080:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

volumes:
  postgres_data:
